<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Reminder</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  /* 霓虹灯管：4 条独立光条，各带渐变流光 + 波浪 + 辉光。
     运动方向统一为逆时针（从正面看）：
     上边 -> 向左，左边 -> 向下，下边 -> 向右，右边 -> 向上 */
  .strip {
    position: fixed;
    pointer-events: none;
    z-index: 10;
    filter: drop-shadow(0 0 16px rgba(255, 110, 210, 0.75))
            drop-shadow(0 0 44px rgba(80, 220, 255, 0.45));
    opacity: 0;
    transition: opacity 0.6s ease-out;
  }
  .strip.show { opacity: 1; }

  /* 波浪形状：实心底带紧贴屏幕边缘（无缝隙），半椭圆凸起沿光带滚动。
     遮罩（--mask-h / --mask-v，JS 生成）= 矩形光带 + 一排半椭圆 */
  .strip-top, .strip-bottom {
    left: 0;
    width: 100%;
    height: 38px; /* 20px 灯带 + 18px 半椭圆凸起 */
  }
  .strip-top { top: 0; }
  .strip-bottom { bottom: 0; transform: scaleY(-1); } /* 翻转：凸起朝屏幕中心 */
  .strip-left, .strip-right {
    top: 0;
    height: 100%;
    width: 38px;
  }
  .strip-left { left: 0; }
  .strip-right { right: 0; transform: scaleX(-1); } /* 翻转：凸起朝屏幕中心 */

  .strip-top, .strip-bottom {
    -webkit-mask: var(--mask-h) repeat-x;
    mask: var(--mask-h) repeat-x;
  }
  .strip-left, .strip-right {
    -webkit-mask: var(--mask-v) repeat-y;
    mask: var(--mask-v) repeat-y;
  }

  /* 管芯高光：灯带中央更亮，边缘渐暗，模拟真实霓虹灯管的玻璃质感 */
  .strip-top::before, .strip-bottom::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.32) 16%,
      rgba(255, 255, 255, 0.62) 26%,
      rgba(255, 255, 255, 0.32) 36%,
      rgba(255, 255, 255, 0) 58%);
  }
  .strip-left::before, .strip-right::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.32) 16%,
      rgba(255, 255, 255, 0.62) 26%,
      rgba(255, 255, 255, 0.32) 36%,
      rgba(255, 255, 255, 0) 58%);
  }

  /* 彩虹渐变（平滑过渡，首尾同色保证循环无缝） */
  .strip-top, .strip-bottom {
    background: linear-gradient(90deg,
      #ff2d78, #ff5a5f, #ff8a3d, #ffc53d, #b8f03d, #5cff9e, #2bd9c0, #00b3ff, #4d7cff, #9d5cff, #ff2d78);
    background-size: 200% 100%;
    background-repeat: repeat;
  }
  .strip-left, .strip-right {
    background: linear-gradient(180deg,
      #ff2d78, #ff5a5f, #ff8a3d, #ffc53d, #b8f03d, #5cff9e, #2bd9c0, #00b3ff, #4d7cff, #9d5cff, #ff2d78);
    background-size: 100% 200%;
    background-repeat: repeat;
  }

  /* 动画：逆时针（上←、左↓、下→、右↑），色彩与波浪同步同向 */
  .strip-top    { animation: slide-x 3.2s linear infinite, wave-drift-x 1.8s linear infinite; }
  .strip-bottom { animation: slide-x-r 3.2s linear infinite, wave-drift-x-r 1.8s linear infinite; }
  .strip-left   { animation: slide-y-r 3.2s linear infinite, wave-drift-y-r 1.8s linear infinite; }
  .strip-right  { animation: slide-y 3.2s linear infinite, wave-drift-y 1.8s linear infinite; }

  @keyframes slide-x   { to { background-position: -200% 0; } }
  @keyframes slide-x-r { to { background-position: 200% 0; } }
  @keyframes slide-y   { to { background-position: 0 -200%; } }
  @keyframes slide-y-r { to { background-position: 0 200%; } }
  @keyframes wave-drift-x   { to { -webkit-mask-position: -160px 0; mask-position: -160px 0; } }
  @keyframes wave-drift-x-r { to { -webkit-mask-position: 160px 0; mask-position: 160px 0; } }
  @keyframes wave-drift-y   { to { -webkit-mask-position: 0 -160px; mask-position: 0 -160px; } }
  @keyframes wave-drift-y-r { to { -webkit-mask-position: 0 160px; mask-position: 0 160px; } }

  /* 通电瞬间霓虹灯管闪烁（同时保持色彩流动与波浪起伏，方向同上） */
  .power-on .strip-top    { animation: flicker 1.0s linear, slide-x 3.2s linear 1.0s infinite, wave-drift-x 1.8s linear infinite; }
  .power-on .strip-bottom { animation: flicker 1.0s linear, slide-x-r 3.2s linear 1.0s infinite, wave-drift-x-r 1.8s linear infinite; }
  .power-on .strip-left   { animation: flicker 1.0s linear, slide-y-r 3.2s linear 1.0s infinite, wave-drift-y-r 1.8s linear infinite; }
  .power-on .strip-right  { animation: flicker 1.0s linear, slide-y 3.2s linear 1.0s infinite, wave-drift-y 1.8s linear infinite; }
  @keyframes flicker {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    24%  { opacity: 0.2; }
    40%  { opacity: 0.9; }
    55%  { opacity: 0.35; }
    75%  { opacity: 1; }
    100% { opacity: 1; }
  }
  /* 结束淡出 */
  .fade-out .strip { opacity: 0 !important; }
</style>
</head>
<body>
  <div class="strip strip-top" id="st"></div>
  <div class="strip strip-bottom" id="sb"></div>
  <div class="strip strip-left" id="sl"></div>
  <div class="strip strip-right" id="sr"></div>
  <script>
    (function () {
      function log(msg) {
        try {
          if (window.__TAURI__ && window.__TAURI__.core) {
            window.__TAURI__.core.invoke('debug_log', { line: 'neon-page: ' + msg });
          }
        } catch (e) {}
        // 浏览器预览时也输出到控制台
        if (typeof console !== 'undefined') console.log('[neon]', msg);
      }
      log('page loaded');

      // 生成波浪遮罩：矩形实心光带（紧贴屏幕边缘，无缝隙）+
      // 一排半椭圆凸起（沿光带滚动形成波浪）。
      // P=凸起间距 160px，B=凸起高度 18px，band=光带宽 20px
      function waveMaskURI(vertical) {
        const P = 160, B = 18, band = 20;
        const T = band + B; // 遮罩片尺寸
        const RX = P / 2 - 14; // 半椭圆横向半径（更修长，凸起间留优雅间隙）
        const svg = vertical
          ? "<svg xmlns='http://www.w3.org/2000/svg' width='" + T + "' height='" + P + "'>" +
            "<rect width='" + band + "' height='" + P + "' fill='white'/>" +
            "<ellipse cx='" + band + "' cy='" + (P / 2) + "' rx='" + B + "' ry='" + RX + "' fill='white'/></svg>"
          : "<svg xmlns='http://www.w3.org/2000/svg' width='" + P + "' height='" + T + "'>" +
            "<rect width='" + P + "' height='" + band + "' fill='white'/>" +
            "<ellipse cx='" + (P / 2) + "' cy='" + band + "' rx='" + RX + "' ry='" + B + "' fill='white'/></svg>";
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      }
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--mask-h', 'url("' + waveMaskURI(false) + '")');
      rootStyle.setProperty('--mask-v', 'url("' + waveMaskURI(true) + '")');
      log('wave masks ready');

      const root = document.body;
      // 霓虹灯管通电闪烁 -> 渐变流光(灯带波浪起伏) -> 淡出 -> 关闭窗口
      root.classList.add('power-on');
      document.querySelectorAll('.strip').forEach(s => s.classList.add('show'));
      setTimeout(() => root.classList.remove('power-on'), 4400);
      setTimeout(() => root.classList.add('fade-out'), 4500);
      setTimeout(() => {
        log('closing');
        try {
          window.__TAURI__.window.getCurrentWindow().close();
        } catch (e) { log('close failed: ' + e); }
      }, 6000);
    })();
  </script>
</body>
</html>
