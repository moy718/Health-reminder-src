<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提醒</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }
  .card {
    position: fixed;
    inset: 0;
    margin: 0;
    box-sizing: border-box;
    background: rgba(20, 24, 34, 0.92);
    border: 1px solid rgba(120, 200, 255, 0.35);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    opacity: 0;
    transform: translateY(-16px);
    transition: opacity 0.35s ease-out, transform 0.35s ease-out;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  .card.show {
    opacity: 1;
    transform: translateY(0);
  }
  .icon {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .msg {
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub {
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">🚶</div>
    <div>
      <div class="msg" id="msg">请走动一会</div>
      <div class="sub" id="sub">休息一下吧</div>
    </div>
  </div>
  <script>
    (function () {
      const card = document.getElementById('card');
      const iconEl = document.getElementById('icon');
      const msgEl = document.getElementById('msg');
      const subEl = document.getElementById('sub');

      const ICON_BY_MSG = {
        '请走动一会': ['🚶', '#4da3ff'],
        '请喝水': ['💧', '#38c172'],
        '请远眺': ['👀', '#f6ad55'],
      };
      const SUB_BY_MSG = {
        '请走动一会': '起来活动一下，拉伸肩颈',
        '请喝水': '补充水分，保持活力',
        '请远眺': '看看远处，放松眼睛',
      };

      function show(msg, subText) {
        const cfg = ICON_BY_MSG[msg] || ['⏰', '#a78bfa'];
        iconEl.textContent = cfg[0];
        iconEl.style.background = cfg[1] + '33';
        iconEl.style.color = cfg[1];
        msgEl.textContent = msg;
        subEl.textContent = subText || SUB_BY_MSG[msg] || '';
        card.classList.add('show');
      }

      function hide() {
        card.classList.remove('show');
      }

      function log(msg) {
        try {
          if (window.__TAURI__ && window.__TAURI__.core) {
            window.__TAURI__.core.invoke('debug_log', { line: 'popup-page: ' + msg });
          }
        } catch (e) {}
      }

      let hideTimer = null;
      try {
        window.__TAURI__.event.listen('popup-show', (e) => {
          log('event received: ' + e.payload);
          // payload: { msg, sub } 或纯字符串
          const data = (typeof e.payload === 'string') ? { msg: e.payload, sub: '' } : e.payload;
          show(data.msg, data.sub);
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(hide, 12000); // 12 秒后自动隐藏
        });
        log('listener ready');
      } catch (e) {
        log('listen failed: ' + e);
      }
    })();
  </script>
</body>
</html>
